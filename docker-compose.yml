services:
  gateway-service:
    build:
      context: /srv/ceo-app/microservices/gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    restart: unless-stopped
    working_dir: /srv/ceo-app/microservices/gateway-service
    volumes:
      - /srv/ceo-app/microservices/gateway-service:/srv/ceo-app/microservices/gateway-service
    networks:
      - ceo_network
    depends_on:
      - gateway_mysql

  gateway_mysql:
    image: mysql:8.0
    container_name: gateway_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: gateway-service
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    volumes:
      - mysql_data:/var/lib/mysql
      - /srv/ceo-app/infra/mysql-init:/docker-entrypoint-initdb.d
    networks:
      - ceo_network

  nginx_central:
    image: nginx:alpine
    container_name: nginx_central
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /srv/ceo-app/infra/nginx-central/conf.d:/etc/nginx/conf.d
    networks:
      - ceo_network
    depends_on:
      - gateway-service

    gateway_kafka_consumer:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: gateway_kafka_consumer
        working_dir: /srv/ceo-app/microservices/gateway-service
        volumes:
            - ./:/var/www
        networks:
            - ceo_network
        depends_on:
            - gateway-service
        command: php artisan kafka:consume:generic
        restart: unless-stopped

networks:
  ceo_network:
    external: true

volumes:
  mysql_data:
