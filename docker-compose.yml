services:
    gateway-service:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: gateway-service
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - ./storage:/var/www/storage
            - ./bootstrap/cache:/var/www/bootstrap/cache
            - gateway_vendor:/var/www/vendor

        networks:
            - ceo_network
        depends_on:
            - gateway-mysql
            - redis

    gateway-web:
        image: nginx:alpine
        container_name: gateway-web
        restart: unless-stopped
        ports:
            - "8001:80"
        volumes:
            - ./:/var/www
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - gateway-service
        networks:
            - ceo_network

    gateway-mysql:
        image: mysql:8.0
        container_name: gateway-mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: admin
            MYSQL_DATABASE: gateway_service
            MYSQL_USER: admin
            MYSQL_PASSWORD: admin
        volumes:
            - mysql_data:/var/lib/mysql
            - ./docker/mysql-init:/docker-entrypoint-initdb.d
        ports:
            - "3307:3306"
        networks:
            - ceo_network
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'redis_data:/data'
        networks:
            - ceo_network

    gateway-queue-worker:
        image: ghcr.io/sharidahcompany/gateway-service:latest
        container_name: gateway-queue-worker
        restart: unless-stopped
        working_dir: /var/www
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
        volumes:
            - gateway_storage:/var/www/storage
            - gateway_cache:/var/www/bootstrap/cache
        networks:
            - ceo_network
        depends_on:
            - gateway-service
            - gateway-mysql
        command: php artisan queue:work --verbose --tries=3

networks:
    ceo_network:
        external: true

volumes:
    mysql_data:
    gateway_vendor:
    gateway_storage:
    gateway_cache:
    redis_data:
        driver: local
