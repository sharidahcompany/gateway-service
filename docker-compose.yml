services:
    gateway-service:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: gateway-service
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
            - ./storage:/var/www/storage
            - ./bootstrap/cache:/var/www/bootstrap/cache
            - gateway_vendor:/var/www/vendor

        networks:
            - ceo_network
        depends_on:
            - gateway-mysql

    gateway-web:
        image: nginx:alpine
        container_name: gateway-web
        restart: unless-stopped
        ports:
            - "8001:80"
        volumes:
            - .:/var/www
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - gateway-service
        networks:
            - ceo_network

    # gateway-kafka-consumer:
    #     build:
    #         context: .
    #         dockerfile: Dockerfile
    #     container_name: gateway-kafka-consumer
    #     restart: unless-stopped
    #     working_dir: /var/www
    #     volumes:
    #         - /srv/ceo-app/microservices/gateway-service:/var/www
    #         - /srv/ceo-app/microservices/gateway-service/storage:/var/www/storage
    #         - /srv/ceo-app/microservices/gateway-service/bootstrap/cache:/var/www/bootstrap/cache
    #         - gateway_vendor:/var/www/vendor
    #     networks:
    #         - ceo_network
    #     depends_on:
    #         - gateway-service
    #     command: php artisan kafka:consume:generic

    gateway-mysql:
        image: mysql:8.0
        container_name: gateway-mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: admin
            MYSQL_DATABASE: gateway_service
            MYSQL_USER: admin
            MYSQL_PASSWORD: admin
        volumes:
            - mysql_data:/var/lib/mysql
            - ./docker/mysql-init:/docker-entrypoint-initdb.d
        ports:
            - "3307:3306"
        networks:
            - ceo_network

networks:
    ceo_network:
        external: true

volumes:
    mysql_data:
    gateway_vendor:
    gateway_storage:
    gateway_cache:
