name: Laravel Microservice CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build and start containers
      run: |
        docker-compose up -d --build

    - name: Wait for services to be ready
      run: sleep 20

    - name: Run Laravel tests
      run: docker-compose exec app php artisan test

    - name: Tear down containers
      run: docker-compose down -v

    - name: Deploy to server via SSH
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        echo "$SSH_PRIVATE_KEY" > private_key.pem
        chmod 600 private_key.pem

        ssh -i private_key.pem -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          cd /home/ceo-app/gateway-service || mkdir -p /home/ceo-app/gateway-service && cd /home/ceo-app/gateway-service

          if [ ! -d ".git" ]; then
            echo "No git repo found. Cloning..."
            git clone https://github.com/sharidahco/gateway_service .
          else
            echo "Git repo found. Pulling latest changes..."
            git pull origin main
          fi

          docker-compose down -v
          docker-compose up -d --build
        EOF

        rm private_key.pem
